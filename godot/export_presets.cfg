; As duas exportações do FORJA (scripts/exportar.sh): o binário Linux e o .exe
; do Windows — o mesmo que roda pelo Proton. As provas (testes/) ficam fora.
; O módulo nativo vai ao lado do executável: o forja.gdextension diz qual.
; O .exe sai com o ícone e os metadados do Godot: trocá-los pede o rcedit (um
; .exe) rodando pelo Wine na exportação, e o jogo não precisa disso.

