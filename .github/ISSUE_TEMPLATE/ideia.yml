name: Uma ideia
description: Sugira uma sala, um ajuste ou uma melhoria.
title: "[Ideia] "
labels: ["enhancement"]
type: Ideia
body:
  - type: textarea
    id: ideia
    attributes:
      label: O que você imagina
      description: Conte a situação, não só a solução.
    validations:
      required: true
  - type: textarea
    id: quem-joga
    attributes:
      label: Para quem ajudaria
      description: Quem joga com você, e o que mudaria na noite de jogo.
