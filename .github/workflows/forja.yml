# MEDIDA (só no ramo medida/forja-exe-4-7, nunca no main): por que o .exe do
# Godot 4.7.2 cai no Wine do Ubuntu (corrida 37630599850, page fault em
# 00006FFFFF4B0608). Uma corrida mede as três perguntas da sprint
# A-FORJA-EXPORTA-O-EXE-NO-GODOT-4-7-01:
#   1. o motor ou a extensão: o .exe do 4.7.2 sem a dll, com a dll da API 4.7 e
#      com a da API 4.4; o .exe do 4.4.1 com a dll da API 4.4;
#   2. o Wine: cada variante no Wine do apt (9.0), no WineHQ estável e no
#      GE-Proton11-7 (o que a bancada usa);
#   3. o endereço: todas com WINEDEBUG=+seh,+loaddll.
# Nenhum job reprova pela queda: a resposta é a linha RESULTADO e os logs.
name: FORJA (medida do .exe)

on:
  push:
    branches: [medida/forja-exe-4-7]
  workflow_dispatch:

permissions:
  contents: read

# Um push novo neste ramo de medida substitui a corrida anterior.
concurrency:
  group: medida-forja-exe
  cancel-in-progress: true

jobs:
  modulo:
    name: A dll (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: ["4.7", "4.4"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependências
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y --no-install-recommends cmake ninja-build mingw-w64

      - name: O SDL e o godot-cpp em cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: deps-windows-${{ hashFiles('scripts/compilar.sh') }}

      - name: O módulo Windows
        env:
          GODOT_CPP_API: ${{ matrix.api }}
        run: scripts/compilar.sh windows

      - uses: actions/upload-artifact@v4
        with:
          name: dll-api${{ matrix.api }}
          path: godot/bin/libforja.windows.x86_64.dll
          if-no-files-found: error

  exportar:
    name: O .exe (Godot ${{ matrix.godot }})
    runs-on: ubuntu-24.04
    needs: [modulo]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - godot: 4.7.2-stable
            api: "4.7"
            linux_sha: d9f79ab89b5ae369aeed11c6052d402e8218cd503bf85b4a235f9c30c46a7c63
            windows_sha: d34d36f3be1a6c49c56525ae86469b92e4f417ddf0b43cf00dd80c385c4b0562
          - godot: 4.4.1-stable
            api: "4.4"
            linux_sha: 820f3fec74869f088dc4509737a5d30a8b54208a75d148ec26da9e0e839d9d9a
            windows_sha: b493c1d53fb915f7805f360cfe42d1c3126e720dfc234a4b0f2feb99200f9a4b
    steps:
      - uses: actions/checkout@v4

      - name: A dll da API ${{ matrix.api }}
        uses: actions/download-artifact@v4
        with:
          name: dll-api${{ matrix.api }}
          path: godot/bin

      - name: Exportar o .exe
        env:
          FORJA_GODOT_VER: ${{ matrix.godot }}
          FORJA_MODELO_LINUX_SHA256: ${{ matrix.linux_sha }}
          FORJA_MODELO_WINDOWS_SHA256: ${{ matrix.windows_sha }}
          FORJA_EXPORTAR_TOLERANTE: "1"
        run: |
          scripts/exportar.sh windows
          ls -la dist/forja-windows-x86_64
          cp dist/*.log dist/forja-windows-x86_64/ 2> /dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exe-${{ matrix.godot }}
          path: dist/forja-windows-x86_64/
          if-no-files-found: error

  medir:
    name: Medir (${{ matrix.wine }}, ${{ matrix.variante }})
    runs-on: ubuntu-24.04
    needs: [modulo, exportar]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        wine: [apt, winehq, proton]
        variante: [exe47-dll47, exe47-semdll, exe47-dll44, exe44-dll44]
    steps:
      - uses: actions/checkout@v4

      - name: Os .exe e as dll
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: O Wine do apt (o mesmo do forja.yml do main)
        timeout-minutes: 15
        if: matrix.wine == 'apt'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y --no-install-recommends wine wine64

      - name: O Wine estável do WineHQ
        timeout-minutes: 15
        if: matrix.wine == 'winehq'
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -q -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -q -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y winehq-stable
          echo "WINE=$(command -v wine)" >> "$GITHUB_ENV"

      - name: O Wine do GE-Proton11-7
        timeout-minutes: 15
        if: matrix.wine == 'proton'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ge.tar.gz" \
            https://github.com/GloriousEggroll/proton-ge-custom/releases/download/GE-Proton11-7/GE-Proton11-7-x86_64.tar.gz
          tar -xzf "$RUNNER_TEMP/ge.tar.gz" -C "$RUNNER_TEMP"
          dir="$(ls -d "$RUNNER_TEMP"/GE-Proton11-7*/ | head -1)"
          ls "$dir/files/bin" "$dir/files/lib"
          find "$dir/files/lib" -name 'libvkd3d-1.dll' -o -name 'freetype*' | head
          # O script do Proton põe o vkd3d no caminho das dll; o wine sozinho não acha.
          vk="$(dirname "$(dirname "$(find "$dir/files/lib" -path '*x86_64-windows/libvkd3d-1.dll' | head -1)")")"
          echo "WINEDLLPATH=${vk}:${dir}files/lib/wine" >> "$GITHUB_ENV"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y --no-install-recommends libfreetype6
          echo "WINE=${dir}files/bin/wine" >> "$GITHUB_ENV"
          echo "WINESERVER=${dir}files/bin/wineserver" >> "$GITHUB_ENV"

      - name: A pasta da variante
        run: |
          ls -R artefatos | head -40
          v="${{ matrix.variante }}"
          case "$v" in
            exe47-*) cp -r artefatos/exe-4.7.2-stable variante ;;
            exe44-*) cp -r artefatos/exe-4.4.1-stable variante ;;
          esac
          rm -f variante/libforja.windows.x86_64.dll
          case "$v" in
            *-dll47) cp artefatos/dll-api4.7/libforja.windows.x86_64.dll variante/ ;;
            *-dll44) cp artefatos/dll-api4.4/libforja.windows.x86_64.dll variante/ ;;
          esac
          sha256sum variante/* || true

      - name: Rodar o .exe com +seh,+loaddll
        timeout-minutes: 25
        run: |
          tempo=900
          [ "${{ matrix.variante }}" = exe47-semdll ] && tempo=240
          bash tests/medir_o_exe_no_wine.sh variante "${{ matrix.wine }} ${{ matrix.variante }}" "$tempo" logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.wine }}-${{ matrix.variante }}
          path: logs/
