# FORJA, a Hefesto Tech Demo: o módulo nativo do jogo 3D (a GDExtension com o
# SDL3 dentro) para Linux e para Windows, as provas da lógica, as ferramentas
# de bancada e a prova do jogo — o Godot headless com quatro DualSense
# simulados, conferindo o que cada controle recebeu, sala por sala. No fim, o
# jogo exportado (o binário Linux e o .exe) joga a Prova de Fogo inteira nos
# dois sistemas, e os dois pacotes ficam como artefatos.
name: FORJA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A versão é a do scripts/engine.sh (ADR-009); o passo «A versão do Godot é a do engine.sh» reprova se divergirem.
  GODOT_VERSAO: "4.7.2-stable"

jobs:
  linux:
    name: Linux — módulo, provas e a prova do jogo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a versão do jogo vem do git describe

      - name: A prova sem rastro (termo interno, trailer de coautoria, AGENTS.md; ela se prova sozinha)
        run: bash tests/prova_sem_rastro.sh

      - name: Dependências (o SDL carrega X11, Wayland e o som em tempo de execução)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libudev-dev

      - name: O SDL e o godot-cpp em cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: deps-linux-${{ hashFiles('scripts/compilar.sh') }}

      - name: As provas da lógica (sem SDL, sem Godot)
        run: scripts/compilar.sh testes

      - name: O módulo Linux
        run: scripts/compilar.sh linux

      - name: As ferramentas de bancada e as provas delas
        run: make all

      - name: A versão do Godot é a do engine.sh
        run: |
          grep -q "FORJA_GODOT_VER:-${GODOT_VERSAO}}" scripts/engine.sh \
            || { echo "o CI baixa o Godot ${GODOT_VERSAO}, e o scripts/engine.sh pede outro: alinhe os dois"; exit 1; }

      - name: O Godot em cache
        id: godot
        uses: actions/cache@v4
        with:
          path: tools
          key: godot-${{ env.GODOT_VERSAO }}

      - name: Baixar o Godot
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSAO}/Godot_v${GODOT_VERSAO}_linux.x86_64.zip"
          unzip -o -q /tmp/godot.zip -d tools

      - name: A prova do jogo (quatro DualSense simulados, headless)
        run: bash tests/prova_do_jogo.sh

      - name: A prova de poucos (as salas com 1, 2 e 3 controles, e o microfone mudo)
        run: bash tests/prova_de_poucos.sh

      - name: A prova da bancada (os experimentos do experimental/, sem aparelho)
        run: bash tests/prova_da_bancada.sh

      - uses: actions/upload-artifact@v4
        with:
          name: forja-modulo-linux-x86_64
          path: godot/bin/libforja.linux.x86_64.so
          if-no-files-found: error

  windows:
    name: Windows — o módulo (mingw-w64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build mingw-w64

      - name: O SDL e o godot-cpp em cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: deps-windows-${{ hashFiles('scripts/compilar.sh') }}

      - name: O módulo Windows
        run: scripts/compilar.sh windows

      - name: A DLL só depende do que o Windows (e o Proton) já têm, e só exporta a porta de entrada
        run: |
          dll=godot/bin/libforja.windows.x86_64.dll
          x86_64-w64-mingw32-objdump -p "$dll" | awk '/DLL Name/ { print $3 }' | sort -u | tee dlls.txt
          permitidas='^(ADVAPI32|CFGMGR32|GDI32|IMM32|KERNEL32|OLEAUT32|SETUPAPI|SHELL32|USER32|VERSION|WINMM|msvcrt|ole32|dinput8|dxgi|d3d11|d3d12|dwmapi|uxtheme|hid|WS2_32|bcrypt|CRYPT32)\.dll$'
          if grep -viE "$permitidas" dlls.txt; then
            echo "a DLL pede uma DLL que não vem com o Windows" >&2
            exit 1
          fi
          x86_64-w64-mingw32-objdump -p "$dll" | grep -q forja_iniciar_biblioteca

      - uses: actions/upload-artifact@v4
        with:
          name: forja-modulo-windows-x86_64
          path: godot/bin/libforja.windows.x86_64.dll
          if-no-files-found: error

  exportar:
    name: Exportação — o binário Linux e o .exe, e a Prova de Fogo nos dois
    runs-on: ubuntu-24.04
    needs: [linux, windows]
    env:
      # O Wine do .exe: o do GE-Proton, fixo pela versão e pelo sha256 do pacote (o que a página da release mostra).
      # O Wine 9.0 do apt do Ubuntu derruba o Godot 4.6+ antes do main (tests/prova_da_exportacao.sh diz por quê).
      GE_PROTON_VERSAO: "GE-Proton11-7"
      GE_PROTON_SHA256: "c5448b76a230384e2d7bc6beb5ccb97bafb7e2c3b6c527cb03a1a546bbcb00a0"
    steps:
      - uses: actions/checkout@v4

      - name: Os dois módulos (os artefatos dos jobs acima)
        uses: actions/download-artifact@v4
        with:
          pattern: forja-modulo-*
          path: godot/bin
          merge-multiple: true

      - name: A versão do Godot é a do engine.sh
        run: |
          grep -q "FORJA_GODOT_VER:-${GODOT_VERSAO}}" scripts/engine.sh \
            || { echo "o CI baixa o Godot ${GODOT_VERSAO}, e o scripts/engine.sh pede outro: alinhe os dois"; exit 1; }

      - name: O Godot em cache
        id: godot
        uses: actions/cache@v4
        with:
          path: tools
          key: godot-${{ env.GODOT_VERSAO }}

      - name: Baixar o Godot
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSAO}/Godot_v${GODOT_VERSAO}_linux.x86_64.zip"
          unzip -o -q /tmp/godot.zip -d tools

      - name: Os modelos de exportação em cache (o Linux e o Windows, por sha256)
        uses: actions/cache@v4
        with:
          path: .cache/godot-dados
          key: modelos-${{ env.GODOT_VERSAO }}-${{ hashFiles('scripts/exportar.sh') }}

      - name: Exportar o jogo (o binário Linux, o .exe e o AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          scripts/exportar.sh tudo
          scripts/exportar.sh appimage

      - name: O Wine do GE-Proton, a base do Proton, para rodar o .exe (por versão e sha256)
        run: |
          pacote="$RUNNER_TEMP/${GE_PROTON_VERSAO}-x86_64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$pacote" \
            "https://github.com/GloriousEggroll/proton-ge-custom/releases/download/${GE_PROTON_VERSAO}/${GE_PROTON_VERSAO}-x86_64.tar.gz"
          echo "${GE_PROTON_SHA256}  ${pacote}" | sha256sum -c -
          proton="$RUNNER_TEMP/ge-proton"
          mkdir -p "$proton"
          tar -xzf "$pacote" -C "$proton" --strip-components=1
          rm -f "$pacote"
          # O wine do Proton usa o FreeType do sistema e, fora do script do Proton, não acha o vkd3d sozinho.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype6
          {
            echo "WINE=$proton/files/bin/wine"
            echo "WINESERVER=$proton/files/bin/wineserver"
            echo "WINEDLLPATH=$proton/files/lib/vkd3d:$proton/files/lib/wine"
          } >> "$GITHUB_ENV"

      - name: A prova da exportação (a Prova de Fogo no binário Linux e no .exe pelo Wine)
        run: bash tests/prova_da_exportacao.sh

      - name: Os logs do Wine, quando o .exe cai (+seh,+loaddll)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forja-o-exe-no-wine
          path: dist/o-exe-no-wine/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: forja-linux-x86_64
          path: dist/forja-linux-x86_64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: forja-windows-x86_64
          path: dist/forja-windows-x86_64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: forja-appimage-x86_64
          path: dist/FORJA-x86_64.AppImage
          if-no-files-found: error

  telas:
    name: As telas — as fotos do jogo contra as da versão anterior
    runs-on: ubuntu-24.04
    needs: [linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: O módulo Linux (o artefato do job acima)
        uses: actions/download-artifact@v4
        with:
          name: forja-modulo-linux-x86_64
          path: godot/bin

      - name: A versão do Godot é a do engine.sh
        run: |
          grep -q "FORJA_GODOT_VER:-${GODOT_VERSAO}}" scripts/engine.sh \
            || { echo "o CI baixa o Godot ${GODOT_VERSAO}, e o scripts/engine.sh pede outro: alinhe os dois"; exit 1; }

      - name: O Godot em cache
        id: godot
        uses: actions/cache@v4
        with:
          path: tools
          key: godot-${{ env.GODOT_VERSAO }}

      - name: Baixar o Godot
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSAO}/Godot_v${GODOT_VERSAO}_linux.x86_64.zip"
          unzip -o -q /tmp/godot.zip -d tools

      - name: A tela virtual e o OpenGL por software
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 libxkbcommon0

      - name: As fotos desta versão
        run: bash tests/telas.sh fotos telas/depois

      - name: As fotos da versão anterior (o cache mais recente deste branch)
        uses: actions/cache/restore@v4
        with:
          path: telas/antes
          key: telas-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            telas-${{ github.ref_name }}-
            telas-main-

      - name: A comparação (relata; não reprova)
        run: bash tests/telas.sh comparar telas/antes telas/depois telas/diferencas

      - name: Guardar estas fotos para a próxima versão
        if: always()
        run: rm -rf telas/antes && cp -r telas/depois telas/antes

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: telas/antes
          key: telas-${{ github.ref_name }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: forja-telas
          path: telas/
          if-no-files-found: error

  release:
    name: O release — os pacotes a cada tag
    runs-on: ubuntu-24.04
    needs: [exportar]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Os três pacotes (os artefatos da exportação)
        uses: actions/download-artifact@v4
        with:
          pattern: forja-*-x86_64
          path: dist
          merge-multiple: true

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${GITHUB_REF_NAME}" --title "FORJA ${GITHUB_REF_NAME}" --generate-notes --verify-tag \
            dist/forja-linux-x86_64.tar.gz dist/forja-windows-x86_64.zip dist/FORJA-x86_64.AppImage
