# A Hefesto Tech Demo: o binário Linux e o .exe do Windows, as provas da
# lógica e o gauntlet com controles simulados (ADR-003). Os dois pacotes saem
# como artefatos da execução.
name: Tech Demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SDL_VERSAO: "3.4.14"

jobs:
  linux:
    name: Linux — binário, provas e gauntlet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a data do último commit entra nos pacotes (SOURCE_DATE_EPOCH)

      - name: Dependências (o SDL carrega X11, Wayland, ALSA, PulseAudio e PipeWire em tempo de execução)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libudev-dev

      - name: O SDL em cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: sdl-${{ env.SDL_VERSAO }}-linux-${{ hashFiles('scripts/compilar.sh') }}

      - name: Compilar, com as provas da lógica
        run: scripts/compilar.sh linux

      - name: O gauntlet (quatro controles simulados, --acelerado, e cada defeito de mentira)
        run: scripts/gauntlet.sh

      - name: A bancada experimental anda (controles simulados)
        run: |
          export SDL_VIDEO_DRIVER=offscreen SDL_AUDIO_DRIVER=dummy
          saida="$(mktemp -d)"
          for exp in laco quatro-mics eco gatilho-cru haptica-nomeada; do
            build/linux/hefesto-tech-demo --tamanho 960x540 --relatorios "$saida/$exp" \
              --simular 4 --robo --acelerado --experimento "$exp"
            grep -q '"tipo": "experimento"' "$saida/$exp"/linha-do-tempo-*.jsonl
          done

      - name: Empacotar
        run: scripts/compilar.sh pacotes

      - uses: actions/upload-artifact@v4
        with:
          name: hefesto-tech-demo-linux-x86_64
          path: dist/hefesto-tech-demo-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows — o .exe (mingw-w64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build mingw-w64

      - name: O SDL em cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: sdl-${{ env.SDL_VERSAO }}-windows-${{ hashFiles('scripts/compilar.sh') }}

      - name: Compilar
        run: scripts/compilar.sh windows

      - name: O .exe só depende do que o Windows (e o Proton) já têm
        run: |
          x86_64-w64-mingw32-objdump -p build/windows/hefesto-tech-demo.exe | awk '/DLL Name/ { print $3 }' | sort -u | tee dlls.txt
          permitidas='^(ADVAPI32|CFGMGR32|GDI32|IMM32|KERNEL32|OLEAUT32|SETUPAPI|SHELL32|USER32|VERSION|WINMM|msvcrt|ole32|dinput8|dxgi|d3d11|d3d12|dwmapi|uxtheme|hid|WS2_32|bcrypt|CRYPT32)\.dll$'
          if grep -viE "$permitidas" dlls.txt; then
            echo "o .exe pede uma DLL que não vem com o Windows" >&2
            exit 1
          fi

      - name: Empacotar
        run: scripts/compilar.sh pacotes

      - uses: actions/upload-artifact@v4
        with:
          name: hefesto-tech-demo-windows-x86_64
          path: dist/hefesto-tech-demo-windows-x86_64.zip
          if-no-files-found: error
