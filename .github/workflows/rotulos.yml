name: Rótulos

# O PR ganha o rótulo da área que mexe (`.github/labeler.yml`), e a issue nova entra no quadro Roteiro
# da organização quando a variável `ROTEIRO_URL` e o segredo `ROTEIRO_TOKEN` existem (o GitHub não
# deixa ligar a entrada automática do quadro por API, e o token do fluxo não escreve em quadro de
# organização).
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  area:
    name: Rótulo da área
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Sem `actions/checkout`: o fluxo roda com permissão de escrita e nunca baixa o código do PR.
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false

  roteiro:
    name: Quadro Roteiro
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEM_TOKEN: ${{ secrets.ROTEIRO_TOKEN != '' && vars.ROTEIRO_URL != '' }}
    steps:
      - if: env.TEM_TOKEN == 'true'
        uses: actions/add-to-project@244f685bbc3b7adfa8466e08b698b5577571133e # v1.0.2
        with:
          project-url: ${{ vars.ROTEIRO_URL }}
          github-token: ${{ secrets.ROTEIRO_TOKEN }}
